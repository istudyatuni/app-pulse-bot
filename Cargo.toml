[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
publish = false

[package]
name = "app-pulse-bot"
version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.bot]
# using this for storing version in db
# this value is reading in crates/common/build.rs
version = 0

[features]
prod = []
test-prod = []

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1.89"
bon = "3.9.1"
camino = "1.1.9"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
derive_more = { version = "1.0.0", features = ["deref", "display", "from", "from_str", "into"] }
dotenvy_macro = "0.15.7"
interly = "0.1.0"
interly-macros = "0.1.0"
log = { version = "0.4.29", features = [ "kv" ] }
opensearch = { version = "2.3.0", default-features = false, features = ["rustls-tls"] }
paste = "1.0.15"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "=0.12.28", default-features = false, features = [ "rustls-tls", "socks" ] }
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"
similar-asserts = "1.6.0"
simplelog = "0.12.2"
sqlx = { version = "0.8.6", features = [ "macros", "migrate", "runtime-tokio", "sqlite", "tls-rustls" ] }
sqlx_migrator = { version = "0.16.2", features = ["sqlite"] }
syn = { version = "2", features = ["printing"] }
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
thiserror = "2.0.18"
time = { version = "0.3.47", features = [ "formatting" ] }
tokio = { version = "1.52.3", features = [ "full" ] }
tokio-util = "0.7.18"
toml = "1.1.2"

bot-handlers = { path = "crates/bot-handlers" }
common = { path = "crates/common" }
db = { path = "crates/db" }
i18n = { path = "crates/i18n" }
macros = { path = "crates/macros" }
sources = { path = "crates/sources" }

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
dotenvy_macro.workspace = true
log.workspace = true
reqwest.workspace = true
serde.workspace = true
simplelog.workspace = true
teloxide.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true

bot-handlers.workspace = true
common.workspace = true
db.workspace = true
i18n.workspace = true
sources.workspace = true

[profile.release]
strip = true

[profile.dev.package."*"]
opt-level = 3
